<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>@marianmeres/sse — live ops feed</title>
		<meta
			name="description"
			content="Reference client for @marianmeres/sse — namespaces, rooms, Last-Event-ID replay, acknowledged publishes and reconnect."
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>"
		/>

		<!--
			Styling is @marianmeres/design-tokens with the Bootstrap Reboot bridge:
			  · reboot.css — Bootstrap Reboot element normalize (consumes --bs-*)
			  · theme.css  — one bundled design-tokens theme + the reboot bridge.
			                 Sets --app-color-* AND --bs-*, light on :root and dark
			                 on :root.dark. Generated by example/build-theme.ts.
			  · app.css    — this example's layout, entirely token-driven.
		-->
		<link rel="stylesheet" href="./reboot.css" />
		<link rel="stylesheet" href="./theme.css" />
		<link rel="stylesheet" href="./app.css" />

		<!-- Pick the mode before first paint so a dark-mode visitor sees no flash. -->
		<script>
		try {
			document.documentElement.classList.toggle(
				"dark",
				matchMedia("(prefers-color-scheme: dark)").matches,
			);
		} catch (e) {}
		</script>
	</head>
	<body>
		<!-- The whole UI lives in templates; client/mod.ts clones and wires them. -->

		<template id="tpl-login">
			<form class="login" data-on="submit:submit">
				<h1>📡 sse ops feed</h1>
				<p class="lead">
					A reference client for
					<a href="https://jsr.io/@marianmeres/sse" target="_blank"
						rel="noopener">@marianmeres/sse</a>: namespaces, rooms,
					acknowledged publishes, reconnect — and
					<strong>replay</strong>, which is the part WebSocket has no
					answer to.
				</p>

				<label>
					<span>Operator</span>
					<input data-ref="name" name="name" autocomplete="off"
						placeholder="alice" />
				</label>

				<label>
					<span>Project</span>
					<input
						data-ref="project"
						name="project"
						autocomplete="off"
						placeholder="acme"
					/>
					<small
					>Becomes the connection's <strong>namespace</strong>. Two projects
						can both have a #deploys and never see each other.</small>
				</label>

				<p class="error" data-ref="error" hidden></p>

				<button type="submit" class="primary">Watch</button>

				<p class="hint">
					A fake pipeline is already publishing. Once inside, hit
					<strong>pause</strong>, wait, then <strong>resume</strong> — replay
					fills in exactly what you missed. <code>pipeline</code>,
					<code>system</code> and <code>admin</code> are refused: the server
					answers <code>401</code>, which is terminal, and the client stops
					retrying rather than hammering away.
				</p>
			</form>
		</template>

		<template id="tpl-feed">
			<div class="feed">
				<header class="feed-header">
					<div class="identity">
						<strong data-ref="you"></strong>
						<span class="sep">·</span>
						<span class="project" data-ref="project"></span>
					</div>
					<div class="header-right">
						<span class="resume" data-ref="resume">live</span>
						<span class="status" data-ref="status">idle</span>
						<button type="button" class="ghost" data-on="click:leave">
							Leave
						</button>
					</div>
				</header>

				<aside class="sidebar">
					<nav class="rooms" data-ref="rooms" aria-label="Rooms"></nav>

					<div class="controls">
						<h2>Try it</h2>
						<button type="button" data-ref="pause"
							data-on="click:togglePause">
							⏸ Pause
						</button>
						<button type="button" data-on="click:burst">
							💥 Burst
						</button>
						<button
							type="button"
							data-ref="maintenance"
							data-on="click:toggleMaintenance"
						>
							🔧 Simulate 503
						</button>
						<p class="note">
							Replay window is <strong data-ref="replaySize"></strong>
							messages. Pause, burst past it, resume — that is a
							<em>gap</em>, and the only case where the app has to
							refetch its own history.
						</p>
					</div>
				</aside>

				<main class="main">
					<div class="log-wrap">
						<ul class="log" data-ref="log" aria-live="polite"></ul>
						<p class="empty" data-ref="empty" hidden>
							Waiting for the pipeline…
						</p>
					</div>

					<form class="composer" data-on="submit:send">
						<input
							data-ref="input"
							autocomplete="off"
							placeholder="Add a comment (works even while paused)"
							aria-label="Comment"
						/>
						<button type="submit" class="primary">Send</button>
					</form>

					<label class="broadcast">
						<input type="checkbox" data-on="change:toggleBroadcast" />
						<span
						>📣 broadcast to all projects —
							<em data-ref="broadcastHint"></em></span>
					</label>

					<p class="room-label">
						in <strong data-ref="roomName"></strong>
					</p>
				</main>
			</div>
		</template>

		<!-- One feed line. `data-kind` and `data-level` drive the styling;
		     everything else is one-directional data → DOM via applyBindings. -->
		<template id="tpl-entry">
			<li class="entry">
				<span class="tag" data-bind="hidden:noTag">replayed</span>
				<span class="who" data-bind="text:who; hidden:noWho"></span>
				<span class="text" data-bind="text:text"></span>
				<span class="meta">
					<span class="ack" data-bind="text:ack; hidden:noAck"></span>
					<time data-bind="text:when"></time>
				</span>
			</li>
		</template>

		<div id="app"></div>

		<!--
			The app. Build it with `deno task example:build` (or example:watch);
			`deno task example` does the build for you before serving.
		-->
		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
